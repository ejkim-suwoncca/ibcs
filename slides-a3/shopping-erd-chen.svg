<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
  <title id="title">Online shopping Chen notation ERD</title>
  <desc id="desc">Chen notation diagram for users, orders, order items, and products in an online shopping database.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .entity { fill: #ffffff; stroke: #d8e0ec; stroke-width: 2; }
      .entity-head { fill: #20304f; }
      .relationship { fill: #fffaf0; stroke: #b98a1f; stroke-width: 2; }
      .line { stroke: #25324a; stroke-width: 3; fill: none; stroke-linecap: round; }
      .title { fill: #20304f; font: 700 22px Arial, sans-serif; letter-spacing: 0.4px; }
      .entity-title { fill: #ffffff; font: 700 16px Arial, sans-serif; letter-spacing: 0.7px; }
      .rel-title { fill: #6e5014; font: 700 14px Arial, sans-serif; letter-spacing: 0.4px; }
      .attr { fill: #26344f; font: 14px Arial, sans-serif; }
      .key { fill: #8a641d; font: 700 14px Arial, sans-serif; }
      .card { fill: #3b4961; font: 700 15px Arial, sans-serif; }
      .caption { fill: #607089; font: 13px Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="390" rx="22"/>
  <text x="640" y="42" text-anchor="middle" class="title">ONLINE SHOPPING ERD - CHEN NOTATION</text>

  <g transform="translate(52 118)">
    <rect class="entity" width="190" height="150" rx="8"/>
    <rect class="entity-head" width="190" height="44" rx="8"/>
    <text x="95" y="28" text-anchor="middle" class="entity-title">USER</text>
    <text x="18" y="76" class="key">UserID</text>
    <text x="18" y="106" class="attr">Name</text>
    <text x="18" y="136" class="attr">Email</text>
  </g>

  <g transform="translate(314 136)">
    <polygon class="relationship" points="80,0 160,58 80,116 0,58"/>
    <text x="80" y="55" text-anchor="middle" class="rel-title">PLACES</text>
    <text x="80" y="75" text-anchor="middle" class="caption">relationship</text>
  </g>

  <g transform="translate(548 118)">
    <rect class="entity" width="190" height="150" rx="8"/>
    <rect class="entity-head" width="190" height="44" rx="8"/>
    <text x="95" y="28" text-anchor="middle" class="entity-title">ORDER</text>
    <text x="18" y="76" class="key">OrderID</text>
    <text x="18" y="106" class="attr">OrderDate</text>
    <text x="18" y="136" class="attr">Status</text>
  </g>

  <g transform="translate(810 136)">
    <polygon class="relationship" points="80,0 160,58 80,116 0,58"/>
    <text x="80" y="55" text-anchor="middle" class="rel-title">CONTAINS</text>
    <text x="80" y="75" text-anchor="middle" class="caption">relationship</text>
  </g>

  <g transform="translate(1038 82)">
    <rect class="entity" width="190" height="126" rx="8"/>
    <rect class="entity-head" width="190" height="44" rx="8"/>
    <text x="95" y="28" text-anchor="middle" class="entity-title">ORDER ITEM</text>
    <text x="18" y="76" class="key">OrderID + ProductID</text>
    <text x="18" y="106" class="attr">Quantity</text>
  </g>

  <g transform="translate(1038 244)">
    <rect class="entity" width="190" height="126" rx="8"/>
    <rect class="entity-head" width="190" height="44" rx="8"/>
    <text x="95" y="28" text-anchor="middle" class="entity-title">PRODUCT</text>
    <text x="18" y="76" class="key">ProductID</text>
    <text x="18" y="106" class="attr">ProductName</text>
  </g>

  <path class="line" d="M242 193 H314"/>
  <path class="line" d="M474 193 H548"/>
  <path class="line" d="M738 193 H810"/>
  <path class="line" d="M970 178 L1038 145"/>
  <path class="line" d="M970 214 L1038 307"/>

  <text x="268" y="181" class="card">1</text>
  <text x="510" y="181" class="card">N</text>
  <text x="764" y="181" class="card">1</text>
  <text x="1000" y="146" class="card">N</text>
  <text x="1000" y="301" class="card">1</text>
</svg>
